databaseChangeLog:
  - changeSet:
      id: create-unregistered-user-table
      author: splitora
      changes:
        - createTable:
            tableName: unregistered_user
            columns:
              - column:
                  name: id
                  type: BINARY(16)
                  constraints:
                    primaryKey: true
              - column:
                  name: created_by
                  type: BINARY(16)
              - column:
                  name: created_on
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: modified_by
                  type: BINARY(16)
              - column:
                  name: modified_on
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone_country_code
                  type: VARCHAR(4)
              - column:
                  name: phone_number
                  type: BIGINT